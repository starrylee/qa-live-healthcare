services:
  # MySQL 数据库服务
  healthcare_mysql:
    image: mysql:8.0
    container_name: healthcare_mysql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=healthcare
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --init-connect=SET NAMES utf8mb4
      - --skip-character-set-client-handshake
    volumes:
      - healthcare_mysql_data:/var/lib/mysql
    networks:
      - healthcare_network
    restart: unless-stopped

  # phpMyAdmin 管理界面
  healthcare_phpmyadmin:
    image: phpmyadmin:latest
    container_name: healthcare_phpmyadmin
    ports:
      - "6080:80"
    environment:
      - PMA_HOST=healthcare_mysql
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    depends_on:
      - healthcare_mysql
    networks:
      - healthcare_network
    restart: unless-stopped

  # 用户服务 - Spring Boot 应用
  qa-service-user:
    build:
      context: ./server/qa-service-user
      dockerfile: Dockerfile
    container_name: qa-service-user
    ports:
      - "18080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
    networks:
      - qa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 问题服务 - Spring Boot 应用
  qa-service-question:
    build:
      context: ./server/qa-service-question
      dockerfile: Dockerfile
    container_name: qa-service-question
    ports:
      - "18081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8081
    networks:
      - qa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/ | grep -E '404|200'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 前端服务 - Nginx + Vue.js
  qa-web:
    build:
      context: ./web/qa-web
      dockerfile: Dockerfile
    container_name: qa-web
    ports:
      - "8088:80"
    depends_on:
      qa-service-user:
        condition: service_healthy
      qa-service-question:
        condition: service_healthy
    networks:
      - qa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  qa-network:
    driver: bridge
  healthcare_network:
    driver: bridge

volumes:
  healthcare_mysql_data:
